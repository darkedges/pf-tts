# Review the installed SPIRE Controller Manager CRD version before applying.
# These cluster-scoped resources are intentionally excluded from the AppProject.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: wai-tts-adapter
spec:
  className: spire-system-spire
  spiffeIDTemplate: '{{ if eq .PodSpec.ServiceAccountName "wai-tts-adapter" }}spiffe://example.org/tts/adapter{{ else }}spiffe://example.org/rejected/{{ .PodMeta.UID }}{{ end }}'
  podSelector:
    matchLabels:
      app.kubernetes.io/component: adapter
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: wai-strict
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: wai-strict-workbench
spec:
  className: spire-system-spire
  spiffeIDTemplate: '{{ if eq .PodSpec.ServiceAccountName "wai-strict-workbench" }}spiffe://example.org/agent/web-app{{ else }}spiffe://example.org/rejected/{{ .PodMeta.UID }}{{ end }}'
  # This workload is the only one that mints a JWT-SVID as the RFC 8693 actor
  # token. PingFederate's reviewed actor token processor rejects an actor token
  # whose lifetime exceeds 300 seconds, so the minted TTL must respect that bound
  # rather than the bound being relaxed to fit a cluster-wide default.
  jwtTtl: 300s
  podSelector:
    matchLabels:
      app.kubernetes.io/component: workbench
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: wai-strict
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: wai-strict-audit
spec:
  className: spire-system-spire
  spiffeIDTemplate: '{{ if eq .PodSpec.ServiceAccountName "wai-strict-audit" }}spiffe://example.org/audit/collector{{ else }}spiffe://example.org/rejected/{{ .PodMeta.UID }}{{ end }}'
  podSelector:
    matchLabels:
      app.kubernetes.io/component: audit
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: wai-strict
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
