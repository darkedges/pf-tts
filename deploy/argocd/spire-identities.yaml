  spiffeIDTemplate: '{{ if eq .PodSpec.ServiceAccountName "wai-strict-gateway" }}spiffe://example.org/gateway/mcp-strict{{ else }}spiffe://example.org/rejected/{{ .PodMeta.UID }}{{ end }}'
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gateway
  namespaceSelector:
    matchLabels:
