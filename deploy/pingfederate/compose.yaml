services:
  pingfederate:
    image: pingidentity/pingfederate:2606-13.1.0
    container_name: wai-pingfederate-13-1
    environment:
      SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
      SERVER_PROFILE_PATH: getting-started/pingfederate
      SERVER_PROFILE_URL_REDACT: "true"
      PING_IDENTITY_ACCEPT_EULA: "YES"
      PING_IDENTITY_DEVOPS_USER: ${PING_IDENTITY_DEVOPS_USER:?Set PING_IDENTITY_DEVOPS_USER in .env.local}
      PING_IDENTITY_DEVOPS_KEY: ${PING_IDENTITY_DEVOPS_KEY:?Set PING_IDENTITY_DEVOPS_KEY in .env.local}
    ports:
      - "127.0.0.1:9999:9999"
      - "127.0.0.1:9031:9031"
    tmpfs:
      - /run/secrets
    volumes:
      - pingfederate-output:/opt/out
    restart: unless-stopped

volumes:
  pingfederate-output:
