# Reviewed deployment input for source revision e9b5452081ea.
# Backchannel calls address the isolated engine Service directly. The issuer
# stays the browser-facing origin because it identifies the token, not a
# location to fetch from.
# Images are pinned to registry manifest-list digests verified for linux/amd64
# and linux/arm64. Secrets remain external to this file and are delivered by
# Vault Secrets Operator.
global:
  pingFederate:
    issuer: https://tst.ping.darkedges.com
    jwksURL: https://wai-pingfederate-engine.wai-pingfederate.svc.cluster.local:9031/pf/JWKS
    caSecretName: wai-pf13-runtime-ca

images:
  ttsAdapter: {repository: docker.io/darkedges/pf-tts-tts-adapter, digest: "sha256:8e6cd7783cb26d2696a6014c2fac051e225b99bcf23699e4bd8c60ed066416e9"}
  gateway: {repository: docker.io/darkedges/pf-tts-strict-mcp-gateway, digest: "sha256:c27a3f510fd2a81b3ebfa4bee7f0a7a151115ffc640b585c78804b308b692450"}
  mcpServer: {repository: docker.io/darkedges/pf-tts-strict-demo-mcp-server, digest: "sha256:9159b3ebe21b2a2187579bb6ae635659cbb33d4a120fef11078c89e880bb9d60"}
  api: {repository: docker.io/darkedges/pf-tts-strict-demo-api, digest: "sha256:e3be54c0d05f5d3e9e15433c84c32dd210dbd5f455d70893f707fe470c6bd244"}
  workbench: {repository: docker.io/darkedges/pf-tts-web-app, digest: "sha256:843b11cc034ce119592b0967d4a04e198cc3abc99240fbc2ec47a754affb3e4b"}
  auditCollector: {repository: docker.io/darkedges/pf-tts-audit-collector, digest: "sha256:4590f83dc87fa3858c6afa7ca6570b38cecc709e065ecf382f3c49d8c598fb72"}

ttsAdapter:
  tokenEndpoint: https://wai-pingfederate-engine.wai-pingfederate.svc.cluster.local:9031/as/token.oauth2
  oauthSecretName: wai-pf13-oauth-token-exchange

workbench:
  tokenEndpoint: https://wai-pingfederate-engine.wai-pingfederate.svc.cluster.local:9031/as/token.oauth2
  oidcSecretName: wai-web-app-secrets
  tlsSecretName: wai-web-app-secrets

vault:
  enabled: true
  address: https://vault.internal.darkedges.com
  kubernetesRole: wai-strict
  caCertSecretRef: wai-vault-server-ca
  kvMount: kv
  paths:
    pingFederateCA: wai/pingfederate-13-1/runtime-ca
    tokenExchangeClient: wai/pingfederate-13-1/oauth/token-exchange
    workbench: wai/workbench

pingFederateEngine:
  namespace: wai-pingfederate
  port: 9031

ingress:
  enabled: true
  className: nginx
  host: workbench.ping.darkedges.com
  pingFederateHost: tst.ping.darkedges.com
  workbenchServiceName: wai-web-app
  workbenchServicePort: 8446
  enginePathPrefixes: ["/as/", "/pf/", "/idp/", "/assets/"]
  engineExactPaths: ["/favicon.ico"]
  pingFederateEngineServiceName: wai-pingfederate-engine-route
  pingFederateEngineExternalName: wai-pingfederate-engine.wai-pingfederate.svc.cluster.local
  pingFederateEngineServicePort: 9031
