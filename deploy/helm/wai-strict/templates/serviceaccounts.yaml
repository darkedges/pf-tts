{{- $root := . -}}
{{- range $component, $name := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "wai-strict.labels" $root | nindent 4 }}
    wai.example.org/workload: {{ $component | quote }}
automountServiceAccountToken: false
{{- end }}
