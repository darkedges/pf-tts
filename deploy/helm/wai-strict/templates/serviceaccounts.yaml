{{- $root := . -}}
{{- $identities := dict "adapter" "spiffe://example.org/tts/adapter" "gateway" "spiffe://example.org/gateway/mcp-strict" "mcpServer" "spiffe://example.org/mcp/demo-strict" "api" "spiffe://example.org/api/demo-strict" "workbench" "spiffe://example.org/agent/web-app" "auditCollector" "spiffe://example.org/audit/collector" -}}
{{- range $component, $name := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  annotations:
    wai.example.org/spiffe-id: {{ required "every strict ServiceAccount requires an exact SPIFFE ID" (index $identities $component) | quote }}
  labels:
    {{- include "wai-strict.labels" $root | nindent 4 }}
    wai.example.org/workload: {{ $component | quote }}
automountServiceAccountToken: false
{{- end }}
