{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wai-strict.fullname" . }}-workbench
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
    app.kubernetes.io/component: workbench
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ printf "%s/%s" .Release.Namespace .Values.workbench.tlsSecretName | quote }}
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "localhost"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wai-strict.fullname" . }}-workbench
                port:
                  number: {{ .Values.ingress.workbenchServicePort }}
---
# This service is only a namespace-local DNS bridge. It exposes the engine
# Service, never the administrator Service or port 9999.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.ingress.pingFederateEngineServiceName }}
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
    app.kubernetes.io/component: pingfederate-engine-route
spec:
  type: ExternalName
  externalName: {{ .Values.ingress.pingFederateEngineExternalName }}
  ports:
    - name: engine-https
      port: {{ .Values.ingress.pingFederateEngineServicePort }}
      targetPort: {{ .Values.ingress.pingFederateEngineServicePort }}
---
# The authorization server has its own origin. Sharing one hostname with the
# application made them same-origin to the browser, so PingFederate's session
# cookie was attached to every workbench API call and the workbench's session
# cookie was sent to the authorization endpoint. Path is not a security
# boundary; a separate origin is.
#
# Only the browser-required engine paths are published. Every in-cluster caller
# reaches the engine through its Service, not through this route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wai-strict.fullname" . }}-pingfederate-engine
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
    app.kubernetes.io/component: pingfederate-engine-route
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: {{ printf "%s/%s" .Release.Namespace .Values.global.pingFederate.caSecretName | quote }}
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/proxy-ssl-name: {{ .Values.ingress.pingFederateHost | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.pingFederateHost | quote }}
      http:
        paths:
          {{- range $path := list "/as/" "/pf/" "/idp/" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.ingress.pingFederateEngineServiceName }}
                port:
                  number: {{ $.Values.ingress.pingFederateEngineServicePort }}
          {{- end }}
{{- end }}
