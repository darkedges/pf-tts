{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wai-strict.fullname" . }}-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wai-strict.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wai-strict.fullname" . }}-call-chain
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wai-strict.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "wai-strict.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "wai-strict.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The isolated PingFederate engine, reached directly by its in-cluster
    # Service. There is deliberately no blanket egress to TCP 443: a broad rule
    # is what allowed the RFC 8693 exchange to resolve PingFederate's public
    # name and travel out through the edge and back, exposing the subject and
    # actor tokens to whatever terminated that TLS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.pingFederateEngine.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.pingFederateEngine.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wai-strict.fullname" . }}-workbench-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wai-strict.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: workbench
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8446
{{- end }}
