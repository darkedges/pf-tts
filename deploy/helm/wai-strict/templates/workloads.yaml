{{- $name := include "wai-strict.fullname" . -}}
{{- $root := . -}}
{{- $components := dict
  "api" (dict "port" 8545 "image" .Values.images.api "serviceAccount" .Values.serviceAccounts.api)
  "mcp" (dict "port" 8544 "image" .Values.images.mcpServer "serviceAccount" .Values.serviceAccounts.mcpServer)
  "gateway" (dict "port" 8543 "image" .Values.images.gateway "serviceAccount" .Values.serviceAccounts.gateway)
  "adapter" (dict "port" 8448 "image" .Values.images.ttsAdapter "serviceAccount" .Values.serviceAccounts.adapter)
  "audit" (dict "port" 8447 "image" .Values.images.auditCollector "serviceAccount" .Values.serviceAccounts.auditCollector)
  "workbench" (dict "port" 8446 "image" .Values.images.workbench "serviceAccount" .Values.serviceAccounts.workbench)
-}}
{{- range $component, $cfg := $components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "wai-strict.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wai-strict.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "wai-strict.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ $cfg.serviceAccount }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "wai-strict.podSecurityContext" $root | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ include "wai-strict.image" (list $cfg.image) | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            {{- include "wai-strict.containerSecurityContext" $root | nindent 12 }}
          ports:
            - name: https
              containerPort: {{ $cfg.port }}
          env:
            {{- include "wai-strict.commonEnv" $root | nindent 12 }}
            {{- if ne $component "audit" }}
            - name: AUDIT_COLLECTOR_URL
              value: https://{{ $name }}-audit:8447
            {{- end }}
            {{- if eq $component "adapter" }}
            - name: TTS_ADAPTER_LISTEN
              value: :8448
            - name: PF_TOKEN_ENDPOINT
              value: {{ required "ttsAdapter.tokenEndpoint is required" $root.Values.ttsAdapter.tokenEndpoint | quote }}
            - name: PF_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "ttsAdapter.oauthSecretName is required" $root.Values.ttsAdapter.oauthSecretName }}
                  key: {{ $root.Values.ttsAdapter.clientIDKey }}
            - name: PF_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.ttsAdapter.oauthSecretName }}
                  key: {{ $root.Values.ttsAdapter.clientSecretKey }}
            {{- else if eq $component "gateway" }}
            - name: STRICT_MCP_SERVER_URL
              value: https://{{ $name }}-mcp:8544
            # The decision point. Unset or "opa" keeps the gateway on the
            # reviewed rego mounted beside it; an unrecognised value makes the
            # gateway refuse to start rather than quietly enforce something else.
            - {name: AUTHORIZATION_PROVIDER, value: {{ $root.Values.authorization.provider | quote }}}
            {{- if eq $root.Values.authorization.provider "pingauthorize" }}
            - {name: PINGAUTHORIZE_URL, value: {{ $root.Values.authorization.pingAuthorize.url | quote }}}
            - {name: PINGAUTHORIZE_CA_FILE, value: /run/pingauthorize/ca.pem}
            {{- end }}
            {{- else if eq $component "mcp" }}
            - name: STRICT_DEMO_API_URL
              value: https://{{ $name }}-api:8545
            {{- else if eq $component "workbench" }}
            - {name: WEB_LISTEN, value: ":8446"}
            - {name: WEB_PUBLIC_URL, value: {{ $root.Values.workbench.publicOrigin | quote }}}
            - {name: OIDC_AUTHORIZATION_ENDPOINT, value: {{ $root.Values.workbench.authorizationEndpoint | quote }}}
            - {name: OIDC_TOKEN_ENDPOINT, value: {{ required "workbench.tokenEndpoint is required" $root.Values.workbench.tokenEndpoint | quote }}}
            - {name: OIDC_REDIRECT_URI, value: {{ $root.Values.workbench.redirectURI | quote }}}
            - {name: TTS_ADAPTER_URL, value: "https://{{ $name }}-adapter:8448/as/token.oauth2"}
            - {name: MCP_GATEWAY_URL, value: "https://{{ $name }}-gateway:8543/mcp"}
            - {name: WEB_TLS_CERT_FILE, value: /run/workbench-tls/tls.crt}
            - {name: WEB_TLS_KEY_FILE, value: /run/workbench-tls/tls.key}
            - name: OIDC_CLIENT_ID
              valueFrom: {secretKeyRef: {name: {{ $root.Values.workbench.oidcSecretName }}, key: {{ $root.Values.workbench.clientIDKey }}}}
            - name: PF_WEB_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: {{ $root.Values.workbench.oidcSecretName }}, key: {{ $root.Values.workbench.clientSecretKey }}}}
            {{- end }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "wai-strict.commonMounts" $root | nindent 12 }}
            {{- if eq $component "workbench" }}
            - {name: workbench-tls, mountPath: /run/workbench-tls, readOnly: true}
            {{- end }}
            {{- if eq $component "gateway" }}
            - name: policy
              mountPath: /run/wai/authorization.rego
              subPath: authorization.rego
              readOnly: true
            {{- if eq $root.Values.authorization.provider "pingauthorize" }}
            - {name: pingauthorize-ca, mountPath: /run/pingauthorize, readOnly: true}
            {{- end }}
            {{- end }}
      volumes:
        {{- include "wai-strict.commonVolumes" $root | nindent 8 }}
        {{- if eq $component "workbench" }}
        - name: workbench-tls
          secret:
            secretName: {{ required "workbench.tlsSecretName is required" $root.Values.workbench.tlsSecretName }}
            items:
              - {key: {{ $root.Values.workbench.tlsCertKey }}, path: tls.crt}
              - {key: {{ $root.Values.workbench.tlsPrivateKeyKey }}, path: tls.key}
        {{- end }}
        {{- if eq $component "gateway" }}
        - name: policy
          configMap:
            name: {{ $name }}-policy
        {{- if eq $root.Values.authorization.provider "pingauthorize" }}
        - name: pingauthorize-ca
          secret:
            secretName: {{ $root.Values.authorization.pingAuthorize.caSecretName }}
            items:
              - {key: {{ $root.Values.authorization.pingAuthorize.caSecretKey | quote }}, path: ca.pem}
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    {{- include "wai-strict.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "wai-strict.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: https
      port: {{ $cfg.port }}
      targetPort: https
{{- end }}
