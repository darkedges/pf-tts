{{- if .Values.vault.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.authServiceAccount }}
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-auth
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: {{ .Values.vault.connectionName }}
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
spec:
  address: {{ .Values.vault.address | quote }}
  skipTLSVerify: false
  {{- if .Values.vault.caCertSecretRef }}
  caCertSecretRef: {{ .Values.vault.caCertSecretRef }}
  {{- end }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Values.vault.authName }}
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
spec:
  vaultConnectionRef: {{ .Values.vault.connectionName }}
  method: kubernetes
  mount: {{ .Values.vault.kubernetesAuthMount }}
  kubernetes:
    role: {{ .Values.vault.kubernetesRole }}
    serviceAccount: {{ .Values.vault.authServiceAccount }}
    audiences:
      - {{ .Values.vault.audience | quote }}
---
{{- if eq .Values.authorization.provider "pingauthorize" }}
# The public certificate of the decision point. The gateway verifies the PDP
# against it and never authenticates to the PDP, so only the public half is
# delivered here; the key pair stays in the product's own Vault record.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "wai-strict.fullname" . }}-pingauthorize-ca
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.authName }}
  mount: {{ .Values.vault.kvMount }}
  type: kv-v2
  path: {{ .Values.vault.paths.pingAuthorizeCA }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  hmacSecretData: true
  destination:
    create: true
    name: {{ .Values.authorization.pingAuthorize.caSecretName }}
  rolloutRestartTargets:
    - {kind: Deployment, name: {{ include "wai-strict.fullname" . }}-gateway}
---
{{- end }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "wai-strict.fullname" . }}-pingfederate-ca
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.authName }}
  mount: {{ .Values.vault.kvMount }}
  type: kv-v2
  path: {{ .Values.vault.paths.pingFederateCA }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  hmacSecretData: true
  destination:
    create: true
    name: {{ .Values.global.pingFederate.caSecretName }}
  rolloutRestartTargets:
    - {kind: Deployment, name: {{ include "wai-strict.fullname" . }}-adapter}
    - {kind: Deployment, name: {{ include "wai-strict.fullname" . }}-gateway}
    - {kind: Deployment, name: {{ include "wai-strict.fullname" . }}-mcp}
    - {kind: Deployment, name: {{ include "wai-strict.fullname" . }}-api}
    - {kind: Deployment, name: {{ include "wai-strict.fullname" . }}-workbench}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "wai-strict.fullname" . }}-token-exchange-client
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.authName }}
  mount: {{ .Values.vault.kvMount }}
  type: kv-v2
  path: {{ .Values.vault.paths.tokenExchangeClient }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  hmacSecretData: true
  destination:
    create: true
    name: {{ .Values.ttsAdapter.oauthSecretName }}
  rolloutRestartTargets:
    - {kind: Deployment, name: {{ include "wai-strict.fullname" . }}-adapter}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "wai-strict.fullname" . }}-workbench
  labels:
    {{- include "wai-strict.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.authName }}
  mount: {{ .Values.vault.kvMount }}
  type: kv-v2
  path: {{ .Values.vault.paths.workbench }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  hmacSecretData: true
  destination:
    create: true
    name: {{ .Values.vault.workbenchDestinationSecret }}
  rolloutRestartTargets:
    - {kind: Deployment, name: {{ include "wai-strict.fullname" . }}-workbench}
{{- end }}
