global:
  imagePullPolicy: IfNotPresent
  spiffeEndpoint: unix:///run/spire/sockets/spire-agent.sock
  trustDomain: example.org
  pingFederate:
    issuer: ""
    jwksURL: ""
    caSecretName: ""
    caSecretKey: ca.pem

images:
  ttsAdapter:
    repository: ""
    tag: ""
    digest: ""
  gateway:
    repository: ""
    tag: ""
    digest: ""
  mcpServer:
    repository: ""
    tag: ""
    digest: ""
  api:
    repository: ""
    tag: ""
    digest: ""
  workbench:
    repository: ""
    tag: ""
    digest: ""
  auditCollector:
    repository: ""
    tag: ""
    digest: ""

ttsAdapter:
  tokenEndpoint: ""
  oauthSecretName: ""
  clientIDKey: client-id
  clientSecretKey: client-secret

workbench:
  authorizationEndpoint: https://tst.ping.darkedges.com/as/authorization.oauth2
  tokenEndpoint: ""
  redirectURI: https://workbench.ping.darkedges.com/oauth/callback
  publicOrigin: https://workbench.ping.darkedges.com
  oidcSecretName: wai-web-app-secrets
  clientIDKey: client-id
  clientSecretKey: client-secret
  tlsSecretName: ""
  tlsCertKey: tls.crt
  tlsPrivateKeyKey: tls.key

# The isolated PingFederate engine that strict workloads call directly for the
# token exchange, the authorization code exchange, and JWKS.
pingFederateEngine:
  namespace: wai-pingfederate
  port: 9031

serviceAccounts:
  adapter: wai-tts-adapter
  gateway: wai-strict-gateway
  mcpServer: wai-strict-mcp
  api: wai-strict-api
  workbench: wai-strict-workbench
  auditCollector: wai-strict-audit

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  host: workbench.ping.darkedges.com
  pingFederateHost: tst.ping.darkedges.com
  workbenchServiceName: wai-web-app
  workbenchServicePort: 8446
  # PingFederate's hosted login and consent pages load their stylesheet and
  # scripts from /assets/, so routing only the protocol prefixes produced a page
  # that rendered unstyled with non-functional scripts. These are the product's
  # own static template resources; they carry no user or configuration data.
  enginePathPrefixes: ["/as/", "/pf/", "/idp/", "/assets/"]
  engineExactPaths: ["/favicon.ico"]
  pingFederateEngineServiceName: wai-pingfederate-engine-route
  pingFederateEngineExternalName: wai-pingfederate-engine.wai-pingfederate.svc.cluster.local
  pingFederateEngineServicePort: 9031

vault:
  enabled: false
  address: ""
  connectionName: wai-vault
  authName: wai-vault-auth
  authServiceAccount: wai-vault-auth
  kubernetesAuthMount: kubernetes
  kubernetesRole: wai-strict
  audience: vault
  caCertSecretRef: ""
  kvMount: secret
  refreshAfter: 5m
  paths:
    pingFederateCA: wai/pingfederate/ca
    tokenExchangeClient: wai/pingfederate/token-exchange-client
    workbench: wai/workbench
  workbenchDestinationSecret: wai-web-app-secrets
