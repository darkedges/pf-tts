apiVersion: v1
kind: ServiceAccount
metadata:
  name: wai-pingauthorize
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
# A separate identity used only to exchange a projected token with Vault. The
# product itself never holds it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.authServiceAccount }}
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
