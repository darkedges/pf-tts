apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wai-pingauthorize-default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wai-pingauthorize-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wai-pingauthorize
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The product fetches its vendor server profile from a public Git host at
    # startup, so this deployment is not air-gapped.
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wai-pingauthorize-decision-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wai-pingauthorize
  policyTypes: [Ingress]
  ingress:
    # The decision point performs no client authentication of its own: the
    # adapter sends no credential and trust is one-way TLS plus reachability.
    # This rule is therefore the access boundary, not a defence-in-depth extra.
    {{- range .Values.decisionIngressNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - {protocol: TCP, port: 1443}
    {{- end }}
