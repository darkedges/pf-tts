apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: {{ .Values.vault.connectionName }}
  namespace: {{ .Values.namespace }}
spec:
  address: {{ .Values.vault.address | quote }}
  skipTLSVerify: false
  caCertSecretRef: {{ .Values.vault.caCertSecretRef }}
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: {{ .Values.vault.authName }}
  namespace: {{ .Values.namespace }}
spec:
  vaultConnectionRef: {{ .Values.vault.connectionName }}
  method: kubernetes
  mount: {{ .Values.vault.kubernetesMount }}
  kubernetes:
    role: {{ .Values.vault.role }}
    serviceAccount: {{ .Values.vault.authServiceAccount }}
    audiences: [{{ .Values.vault.audience | quote }}]
---
{{- $records := dict "administrator" "wai-pf13-administrator" "devops" "wai-pf13-devops" "bootstrap-system" "wai-pf13-bootstrap-system" "oauth/token-exchange" "wai-pf13-oauth-token-exchange" "oauth/browser" "wai-pf13-oauth-browser" "oauth/lab-user" "wai-pf13-oauth-lab-user" "oauth/mcp-gateway" "wai-pf13-oauth-mcp-gateway" "runtime-ca" "wai-pf13-runtime-ca" }}
{{- range $path, $destination := $records }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $destination }}
  namespace: {{ $.Values.namespace }}
spec:
  vaultAuthRef: {{ $.Values.vault.authName }}
  mount: {{ $.Values.vault.kvMount }}
  type: kv-v2
  path: wai/pingfederate-13-1/{{ $path }}
  refreshAfter: {{ $.Values.vault.refreshAfter }}
  hmacSecretData: true
  destination:
    create: true
    name: {{ $destination }}
    overwrite: false
---
{{- end }}
