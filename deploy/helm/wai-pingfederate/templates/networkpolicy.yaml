apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wai-pingfederate-default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wai-pingfederate-dns-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wai-pingfederate
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}
---
{{- if not .Values.adminApi.bootstrapNewInstance }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wai-pingfederate-private-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wai-pingfederate
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wai-pingfederate
      ports:
        - {protocol: TCP, port: 9999}
        - {protocol: TCP, port: 9031}
{{- end }}
