namespace: wai-pingfederate
images:
  runtime: docker.io/darkedges/pf-tts-pingfederate@sha256:7a983488c5ccfc1decf0c1869d95ddd910581b099f9a805b4c393c8dd8bd554e
profile:
  branch: feature/kubernetes-pf13
storage:
  size: 8Gi
  storageClassName: hostpath
vault:
  address: https://vault.internal.darkedges.com
  connectionName: wai-pingfederate-vault
  caCertSecretRef: wai-vault-server-ca
  authName: wai-pingfederate-vault-auth
  authServiceAccount: wai-pingfederate-vault-auth
  role: wai-pingfederate-13-1
  audience: vault
  kubernetesMount: kubernetes
  kvMount: kv
  refreshAfter: 5m
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
