namespace: wai-pingfederate
images:
  runtime: docker.io/darkedges/pf-tts-pingfederate@sha256:ea1729ba09a440fa61f40f05b88e7de84fce739b27a28aade11859f47c189b1a
  pluginJarSHA256: dac3b52715d74e59c595500a24fa16db6b6b0dca7edf37ac79b0974c26974582
profile:
  branch: feature/kubernetes-pf13
adminApi:
  bootstrapNewInstance: false
# Namespaces permitted to reach the engine on 9031. The administrator port is
# never included.
engineIngressNamespaces:
  - wai-strict
  - ingress-nginx

# Keeps the actor token processor in step with SPIRE's rotating JWT authorities.
# SPIRE publishes a prepared key hours before signing with it, so a schedule well
# inside that window means the processor always trusts a key before it is used.
jwksRefresher:
  enabled: true
  image: ""
  schedule: "17 */4 * * *"
  serviceAccount: wai-pf13-jwks-refresher
  adminURL: https://wai-pingfederate-admin.wai-pingfederate.svc.cluster.local:9999/pf-admin-api/v1
  adminCASecretName: wai-pf13-admin-ca
  adminCASecretKey: ca.pem
  spireNamespace: spire-system
  spireBundleConfigMap: spire-bundle

storage:
  size: 8Gi
  storageClassName: hostpath
vault:
  address: https://vault.internal.darkedges.com
  connectionName: wai-pingfederate-vault
  caCertSecretRef: wai-vault-server-ca
  authName: wai-pingfederate-vault-auth
  authServiceAccount: wai-pingfederate-vault-auth
  role: wai-pingfederate-13-1
  audience: vault
  kubernetesMount: kubernetes
  kvMount: kv
  refreshAfter: 5m
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
